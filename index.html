<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارگاه انشا – تمرین نویسندگی (ششم ابتدایی)</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf3fb; --paper:#ffffff; --text:#1f2937; --muted:#5b6475; --line:#cfe2f3;
  --ink:#25409a; --btn:#25409a; --btntext:#ffffff; --red:#d93a2f; --green:#178a4f;
  --hero1:#ffe6f0; --hero2:#e4e9ff; --hl:#ffe35c; --margin:#f4a3a0; --okbg:rgba(23,138,79,.13); --badbg:rgba(217,58,47,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141a26; --paper:#1d2535; --text:#e8edf7; --muted:#9aa6bd; --line:#2b3a55;
    --ink:#9db3ff; --btn:#9db3ff; --btntext:#0f1630; --red:#ff7a6e; --green:#4fd18b;
    --hero1:#2d2142; --hero2:#1d2b4d; --hl:#6b5d0c; --margin:#7a3b3b; --okbg:rgba(79,209,139,.15); --badbg:rgba(255,122,110,.15);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:"Vazirmatn","Vazir",Tahoma,"Segoe UI",system-ui,sans-serif;
  font-size:17px; line-height:1.9; color:var(--text);
  background:var(--bg) repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);
}
body::before{content:"";position:fixed;top:0;bottom:0;right:24px;width:2px;background:var(--margin);z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 44px 70px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
h1{margin:0;font-size:30px;font-weight:800;color:var(--ink);line-height:1.5}
h1 span{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 4px}
h2{margin:0;font-size:24px;font-weight:800;color:var(--ink)}
h3{margin:18px 0 6px;font-size:18px;font-weight:800;color:var(--ink)}
h4{margin:0;font-size:17px;font-weight:800}
p{margin:6px 0}
small{color:var(--muted)}
mark{background:var(--hl);color:inherit;padding:0 4px;border-radius:4px}
.tools{display:flex;gap:8px;align-items:center}
.pill{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:600;color:var(--ink)}
button{font:inherit;color:inherit}
.btn{background:var(--btn);color:var(--btntext);border:0;border-radius:10px;padding:8px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.lead{margin:2px 0 16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;line-height:1.6}
.tile:hover{border-color:var(--c)}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.glyph{flex:0 0 auto;min-width:68px;height:62px;padding:0 6px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;text-align:center;line-height:1.2}
.st{color:#e0a100;letter-spacing:2px;font-size:18px}
.paper{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 22px;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -4px 0 var(--hl)}
.ex{display:inline-block;background:rgba(37,64,154,.08);border-radius:8px;padding:0 10px;margin:2px 0}
.tip{border-right:5px solid var(--hl);background:var(--paper);padding:8px 14px;border-radius:8px;margin:14px 0}
.signs{display:grid;gap:10px}
.sign{display:flex;gap:14px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px}
.sign>b{flex:0 0 52px;text-align:center;font-size:34px;color:var(--ink);line-height:1.3}
.sign p{margin:0}
.prow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border:0}
.chip{flex:0 0 auto;font-size:13px;padding:0 10px;border-radius:999px;background:var(--hl);color:var(--text);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
table{border-collapse:collapse;width:100%;background:var(--paper);border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--line);padding:4px 12px;text-align:center}
th{background:rgba(37,64,154,.1);color:var(--ink)}
.dots{display:flex;gap:6px;margin:4px 0 10px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.dot.now{border-color:var(--ink)}
.dot.ok{background:var(--green);border-color:var(--green)}
.dot.bad{background:var(--red);border-color:var(--red)}
.q{font-size:20px;line-height:2.2;margin:6px 0 10px}
.blank{display:inline-block;min-width:3.4em;border-bottom:2.5px solid var(--ink);text-align:center;font-weight:800;color:var(--ink)}
.opts{display:grid;gap:8px;margin:8px 0}
.opts.big{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:start}
.opts.big .opt{font-size:28px;text-align:center;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--green);background:var(--okbg)}
.opt.bad{border-color:var(--red);background:var(--badbg);color:var(--red)}
.tok{background:none;border:0;border-bottom:2px dashed var(--line);padding:0 6px;margin:3px;cursor:pointer;font-size:20px}
.tok:hover:not(:disabled){border-bottom-color:var(--ink)}
.tok.ok{border-bottom:3px solid var(--green);background:var(--okbg)}
.tok.bad{border-bottom:3px solid var(--red);background:var(--badbg);color:var(--red)}
.block .tok{display:block;width:100%;text-align:start;margin:6px 0;border:1.5px dashed var(--line);border-radius:10px;padding:6px 12px;font-size:18px;line-height:1.9}
.block .tok.ok{border:1.5px solid var(--green)}
.block .tok.bad{border:1.5px solid var(--red)}
.slot{min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:6px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.pool{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.piece{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;text-align:start;line-height:1.8}
.piece:hover:not(:disabled){border-color:var(--ink)}
.piece.ok{border-color:var(--green);background:var(--okbg)}
.piece.bad{border-color:var(--red);background:var(--badbg)}
.note{margin-top:14px;padding:10px 14px;border-radius:10px;border-right:5px solid}
.note.ok{border-color:var(--green);background:var(--okbg)}
.note.bad{border-color:var(--red);background:var(--badbg)}
.note b{color:var(--red)} .note.ok b{color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.big-stars{font-size:48px;color:#e0a100;letter-spacing:6px;line-height:1.4}
.center{text-align:center}
textarea{width:100%;min-height:230px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;line-height:2;background:var(--paper);color:var(--text);resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chipb{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:2px 16px;cursor:pointer}
.chipb[aria-pressed="true"]{border-color:var(--ink);background:var(--hl)}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border:0}
.check i{flex:0 0 26px;font-style:normal;font-weight:800;text-align:center}
.check.ok i{color:var(--green)} .check.bad i{color:var(--red)} .check.wait i{color:var(--muted)}
.check.bad span{color:var(--red)}
label.self{display:flex;gap:10px;align-items:center;cursor:pointer;padding:3px 0}
label.self input{width:20px;height:20px;accent-color:var(--ink)}
.seg{display:flex;gap:8px;margin:10px 0}
.segb{flex:1;padding:10px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-weight:600;cursor:pointer;line-height:1.6}
.segb[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -4px 0 var(--hl)}
details.paper summary{cursor:pointer;font-weight:600;color:var(--ink)}
.exb{background:rgba(37,64,154,.08);border-radius:10px;padding:8px 14px;margin:6px 0}
.btn.small{padding:2px 14px;font-size:14px;margin-top:8px;border-width:1px;font-weight:400}
.credit{margin-top:36px;text-align:center;color:var(--muted);font-size:15px;font-weight:600}
.salavat{margin:12px 0 0;padding:9px 14px;border-radius:12px;background:rgba(15,122,77,.09);border:1.5px solid rgba(15,122,77,.30);font-weight:700;font-size:15px;line-height:1.9;text-align:justify;text-align-last:center}
.salavat .holy{color:#0b6b43;font-weight:800}
@media (prefers-color-scheme:dark){.salavat{background:rgba(111,227,176,.10);border-color:rgba(111,227,176,.35)}.salavat .holy{color:#7be8b8}}
.salavat .glow{color:#0b6b43;text-shadow:0 0 5px rgba(255,196,0,.85),0 0 12px rgba(255,196,0,.55);animation:fshine 2.2s ease-in-out infinite alternate}
@keyframes fshine{from{text-shadow:0 0 3px rgba(255,196,0,.55),0 0 8px rgba(255,196,0,.3)}to{text-shadow:0 0 7px rgba(255,205,40,1),0 0 18px rgba(255,196,0,.8),0 0 28px rgba(255,196,0,.45)}}
@media (prefers-color-scheme:dark){.salavat .glow{color:#b8ffe0;text-shadow:0 0 6px rgba(255,214,90,.9),0 0 14px rgba(255,214,90,.55)}}
@media (prefers-reduced-motion:reduce){.salavat .glow{animation:none}}
.salavat .glow{position:relative;display:inline-block}
.salavat{position:relative;isolation:isolate;overflow:hidden}
.salavat .glow::before{content:'';position:absolute;left:50%;top:50%;width:9em;height:9em;margin:-4.5em 0 0 -4.5em;z-index:-1;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,190,0,.55) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,transparent 68%);mask-image:radial-gradient(circle,#000 8%,transparent 68%);
  animation:sunspin 18s linear infinite}
.salavat .glow::after{content:'';position:absolute;left:50%;top:50%;width:5em;height:5em;margin:-2.5em 0 0 -2.5em;z-index:-1;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,90,.75) 0,rgba(255,214,90,.25) 45%,transparent 72%);
  animation:sunpulse 2.6s ease-in-out infinite alternate}
@keyframes sunspin{to{transform:rotate(360deg)}}
@keyframes sunpulse{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.12)}}
@media (prefers-color-scheme:dark){.salavat .glow::before{background:repeating-conic-gradient(from 0deg,rgba(255,225,120,.5) 0deg 5deg,transparent 5deg 15deg)}}
@media (prefers-reduced-motion:reduce){.salavat .glow::before,.salavat .glow::after{animation:none}}
.chk-note{margin:0 0 10px;color:var(--muted);font-size:14px;font-weight:600;line-height:1.9}
#fb{position:sticky;bottom:0;z-index:6;background:var(--paper);padding-bottom:10px}
#fb .row{margin-top:10px}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
}
@media (max-width:480px){
  body{font-size:16px} h1{font-size:26px}
  .wrap{padding:12px 40px 60px 12px}
  body::before{right:20px}
}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:8px;align-items:center;background:linear-gradient(135deg,var(--hero1),var(--hero2));border:1.5px solid var(--line);border-radius:26px;padding:22px 26px;margin:6px 0 24px;overflow:hidden}
.kicker{display:inline-block;background:var(--paper);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:0 14px;font-weight:600;font-size:14px}
.hero-title{font-size:42px;font-weight:800;line-height:1.45;color:var(--ink);margin:4px 0 2px}
.hero-title span{background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 4px}
.hero-sub{font-size:20px;font-weight:700;color:var(--ink);margin:0 0 6px}
.hero p{margin:4px 0 14px}
.btn.big{padding:12px 30px;font-size:18px;border-radius:14px}
.prog{margin-top:16px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f0a202,#e0457b);border-radius:99px}
.hero-art svg,.hero-art img{width:100%;height:auto;display:block;max-width:360px;margin:0 auto}
.hero-art svg{border-radius:0 0 30px 30px}
.hero-art img{border-radius:20px;border:3px solid var(--paper);max-width:460px;box-shadow:0 6px 0 rgba(0,0,0,.06)}
.sec-h{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec-h::after{content:"";flex:1;border-top:2px dashed var(--line)}
.tile{box-shadow:0 3px 0 var(--line);transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--c)}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tile.accent{background:linear-gradient(135deg,var(--paper),var(--hero2));border-color:var(--c)}
.tile.accent .glyph{font-size:30px}
.fld{display:block;margin:8px 0;font-weight:600}
.fld input,.fld textarea{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--paper);color:var(--text)}
#rnote{min-height:70px}
.rep{min-height:340px;font-size:15px;line-height:1.9}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.step{background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:0 14px;font-weight:600}
.step.done{border-color:var(--green);color:var(--green)}
body.is-home .top h1{display:none}
body.is-home .top{justify-content:flex-start}
@media (prefers-reduced-motion:no-preference){
  .tile:hover{transform:translateY(-3px)}
  .hero-svg .bubble{animation:floaty 4.5s ease-in-out infinite}
  .hero-svg .tw{animation:twinkle 3s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding:16px}
  .hero-art{order:-1}
  .hero-art svg,.hero-art img{max-width:240px}
  .hero-title{font-size:32px}
}
.catb{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:0 16px;cursor:pointer}
.catb[aria-pressed="true"]{background:var(--ink);color:var(--btntext)}
.chipb.alt{border-color:var(--green)}
.cust{flex:1;min-width:150px;border:1.5px solid var(--line);border-radius:10px;padding:4px 12px;font:inherit;background:var(--paper);color:var(--text)}
.goal{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:2px 14px;margin:6px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gbar{display:inline-block;width:90px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#f0a202,#e0457b)}
.check.warn i{color:#b7791f}
.cb{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.rwt{min-height:90px}
.ideas{margin-top:8px}
.ideas summary{cursor:pointer;color:var(--ink);font-weight:600}
.chip.good{background:rgba(23,138,79,.25)}
.chip.bad{background:rgba(217,58,47,.2)}
#printsheet{display:none}
@media print{
  body>*:not(#printsheet){display:none!important}
  #printsheet{display:block!important;direction:rtl;color:#000;background:#fff;padding:14mm;font-size:13pt}
  body{background:#fff!important}
  #printsheet ul{list-style:none;padding:0}
  #printsheet li{margin:8px 0}
}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.setb{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;line-height:1.6;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 0 var(--line)}
.setb:hover{border-color:var(--ink)}
.setb b{font-size:18px;color:var(--ink)}
.setb .st{color:#e0a100;font-size:13px}
@media (max-width:420px){.sets{grid-template-columns:1fr}}
.stp{display:flex;align-items:center;gap:8px;margin:22px 0 6px}
.sn{display:inline-block;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--btntext);text-align:center;line-height:28px;font-size:15px}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.bn{display:flex;flex-direction:column;gap:2px;max-width:260px}
.bn small{line-height:1.6}
.segb small{font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span>کارگاه انشا</span></h1>
  </div>
  <div id="view"></div>
  <footer class="credit">طراح : سارا اقدامی مقدم<br><button class="btn ghost small" id="soundBtn" aria-pressed="true">🔊 صدا</button></footer>
</div>

      v.innerHTML = '<div style="padding:16px;border:2px solid #d93a2f;border-radius:12px;background:#fff;color:#1f2937;line-height:2">برنامه کامل بارگذاری نشد.<br><small dir="ltr" style="display:block;text-align:left;word-break:break-all">' + why + '</small></div>';
    }
  }, 400);
});
</script>

<script>

const $ = s => document.querySelector(s);
const view = $('#view');
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const state = { best:{}, sound:true, essays:[], quizLog:[], sent:false, reportNo:1, pending:false };
const fa = n => Number(n).toLocaleString('fa-IR');
function today(){
  try{ return new Date().toLocaleDateString('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}); }
  catch(e){ return new Date().toLocaleDateString('fa-IR'); }
}
const plain = h => h.replace(/<[^>]*>/g,' ').replace(/___/g,'…').replace(/\s+/g,' ').trim().slice(0,80);
let quiz = null, audio = null;

function tone(freqs, dur=0.11){
  if(!state.sound) return;
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const t = audio.currentTime;
    freqs.forEach((f,i)=>{
      const o=audio.createOscillator(), g=audio.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*dur);
      g.gain.exponentialRampToValueAtTime(0.14,t+i*dur+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*dur+dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t+i*dur); o.stop(t+i*dur+dur+0.03);
    });
  }catch(e){}
}
const sOk = () => tone([660,880]);
const sBad = () => tone([300,220],0.14);
const sWin = () => tone([523,659,784,1047],0.12);

$('#soundBtn').onclick = e => {
  state.sound = !state.sound;
  e.currentTarget.setAttribute('aria-pressed', state.sound);
  e.currentTarget.textContent = state.sound ? '🔊 صدا' : '🔇 بی‌صدا';
};

const starsStr = n => '★'.repeat(n)+'☆'.repeat(3-n);
function updateTotal(){
  const t = Object.values(state.best).reduce((a,b)=>a+b,0);
  const el = $('#starTotal'); if(el) el.textContent = '★ ' + t;
}

/* ---------- تمرین ---------- */
function prepare(q){
  const c = Object.assign({}, q);
  if(q.t==='mcq') c.opts = shuffle(q.o.map((txt,i)=>({txt, ok:i===q.a})));
  if(q.t==='order'){
    let s;
    do{ s = shuffle(q.items.map((txt,idx)=>({txt,idx}))); }while(s.every((x,k)=>x.idx===k));
    c.pool = s; c.placed = [];
  }
  return c;
}
function startQuiz(id){
  const s = SECTIONS.find(x=>x.id===id);
  quiz = { id, title:s.title, i:0, score:0, res:[], wrongs:[], qs:s.qs.map(prepare), done:false };
  drawQ();
}
function dots(){
  return `<div class="dots" aria-hidden="true">${quiz.qs.map((_,k)=>{
    const r = quiz.res[k];
    return `<span class="dot ${k===quiz.i?'now':''} ${r===true?'ok':r===false?'bad':''}"></span>`;
  }).join('')}</div>`;
}
function drawQ(){
  const q = quiz.qs[quiz.i];
  const body = $('#body');
  let h = `<div class="paper"><small>سؤال ${quiz.i+1} از ${quiz.qs.length}</small>${dots()}`;
  if(q.t==='mcq'){
    const text = q.p.includes('___') ? q.p.replace('___','<span class="blank" id="blank">&nbsp;</span>') : q.p;
    h += `<div class="q">${text}</div>
      <div class="opts ${q.big?'big':''}">${q.opts.map((o,k)=>`<button class="opt" data-opt="${k}">${o.txt}</button>`).join('')}</div>`;
  }else if(q.t==='tap'){
    h += `<div class="q">${q.p}</div><div class="${q.block?'block':''}" id="toks">${q.tokens.map((t,k)=>`<button class="tok" data-tok="${k}">${t}</button>`).join(q.block?'':' ')}</div>`;
  }else if(q.t==='order'){
    h += `<div class="q">${q.p}</div>
      <small>جمله‌ها را به ترتیب بزن. برای برگرداندن، روی جمله‌ی چیده‌شده بزن.</small>
      <div class="slot" id="slot"></div><div class="pool" id="pool"></div>
      <div class="row" style="margin-top:6px"><button class="btn" id="chk" disabled data-chk>بررسی</button></div>`;
  }
  h += `<div id="fb"></div></div>`;
  body.innerHTML = h;
  if(q.t==='order') drawOrder();
}
function drawOrder(){
  const q = quiz.qs[quiz.i];
  $('#slot').innerHTML = q.placed.length ? q.placed.map((p,k)=>`<button class="piece" data-un="${k}">${p.txt}</button>`).join('') : '<small>اینجا بچین</small>';
  $('#pool').innerHTML = q.pool.map((p,k)=>`<button class="piece" data-pick="${k}">${p.txt}</button>`).join('');
  $('#chk').disabled = q.pool.length>0;
}
function lockAll(){ document.querySelectorAll('#body button.opt,#body button.tok,#body button.piece,#chk').forEach(b=>b.disabled=true); }
function finishQ(ok, text){
  const q = quiz.qs[quiz.i];
  quiz.res[quiz.i] = ok;
  if(!ok) quiz.wrongs.push(plain(q.p));
  if(ok) quiz.score++;
  ok ? sOk() : sBad();
  const last = quiz.i===quiz.qs.length-1;
  $('#fb').innerHTML = `<div class="note ${ok?'ok pop':'bad'}"><b>${ok?'✓ آفرین!':'✗ دقت کن.'}</b> ${text||q.e}</div>
    <div class="row"><button class="btn" data-next>${last?'دیدن نتیجه':'سؤال بعدی'}</button></div>`;
  document.querySelectorAll('.dot')[quiz.i].className = 'dot now ' + (ok?'ok':'bad');
}
function answerMcq(k){
  const q = quiz.qs[quiz.i];
  const chosen = q.opts[k];
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b,i)=>{ if(q.opts[i].ok) b.classList.add('ok'); });
  if(!chosen.ok) btns[k].classList.add('bad');
  const bl = $('#blank');
  if(bl){ bl.textContent = q.opts.find(o=>o.ok).txt; }
  lockAll();
  finishQ(chosen.ok);
}
function answerTap(k){
  const q = quiz.qs[quiz.i];
  const toks = document.querySelectorAll('.tok');
  const ok = k===q.w;
  toks[q.w].classList.add('ok');
  if(!ok) toks[k].classList.add('bad');
  lockAll();
  finishQ(ok, (q.fix ? `درست: «${q.fix}». ` : '') + q.e);
}
function answerOrder(){
  const q = quiz.qs[quiz.i];
  const ok = q.placed.every((p,k)=>p.idx===k);
  document.querySelectorAll('#slot .piece').forEach((b,k)=>b.classList.add(q.placed[k].idx===k?'ok':'bad'));
  lockAll();
  let t = q.e;
  if(!ok) t += '<br>ترتیب درست:<br>' + q.items.map((x,k)=>`${k+1}. ${x}`).join('<br>');
  finishQ(ok, t);
}
function nextQ(){
  if(quiz.i < quiz.qs.length-1){ quiz.i++; drawQ(); window.scrollTo(0,0); return; }
  state.quizLog.push({id:quiz.id, score:quiz.score, total:quiz.qs.length, wrongs:[...quiz.wrongs]});
  const pct = quiz.score/quiz.qs.length;
  const n = pct>=0.9?3 : pct>=0.6?2 : pct>=0.3?1 : 0;
  state.best[quiz.id] = Math.max(state.best[quiz.id]||0, n);
  updateTotal();
  n>=2 ? sWin() : tone([440,392]);
  const msg = n===3 ? 'عالی بود! این بخش را کامل یاد گرفتی.' : n===2 ? 'خیلی خوب! یک بار دیگر تمرین کنی ستاره‌ی کامل می‌گیری.' : 'ناامید نشو؛ درس را دوباره بخوان و تمرین کن.';
  $('#body').innerHTML = `<div class="paper center">

  window.scrollTo(0,0);
}

const TAZAD = [['شادی','غم'],['روز','شب'],['سرد','گرم'],['بالا','پایین'],['خوب','بد'],['کوچک','بزرگ'],['سیاه','سفید'],['تلخ','شیرین'],['دور','نزدیک'],['زیبا','زشت'],['روشن','تاریک'],['بلند','کوتاه'],['خنده','گریه'],['سبک','سنگین'],['پیر','جوان']];
const NATURE = ['خورشید','ماه','باد','باران','آسمان','ابر','ابرها','درخت','درخت‌ها','گل','گل‌ها','دریا','کوه','برف','ستاره','ستاره‌ها','نسیم','رود','رودخانه','شاخه','شاخه‌ها','بهار','زمین'];
const HUMANV = ['لبخند زد','خندید','گریه کرد','گریه می‌کرد','نجوا','رقصید','خوابید','چشمک زد','سلام کرد','حرف می‌زد','بیدار شد'];
const BIGRE = /(هزار بار|هزاران|میلیون بار|میلیون‌ها|بی‌نهایت|تا آسمان|تا ابد|داشتم می‌مردم|داشت می‌مرد)/;
const IDIOMS = ['آب شدم','دستش باز','دست‌باز','سر به هوا','سرش به کار خودش گرم','دست و پایم را گم کردم','رنگش پرید','دلم هری ریخت','سر به زیر'];
function detectArayeh(text){
  const found = [];
  const toks = wordsOf(text);
  if(toks.some(t=>SIMILE.includes(t))) found.push('تشبیه');
  const sens = sentencesOf(text);
  if(sens.some(x=>{ const w = wordsOf(x); return TAZAD.some(([a,b])=>w.includes(a) && w.includes(b)); })) found.push('تضاد');
  if(IDIOMS.some(i=>text.includes(i))) found.push('کنایه');
  if(BIGRE.test(text)) found.push('مبالغه');
  if(sens.some(x=>{ const w = wordsOf(x); return w.some(t=>NATURE.includes(t)) && HUMANV.some(h=>x.includes(h)); })) found.push('جان‌بخشی');
  return found;
}
function evaluateThree(raw){
  const text = raw.replace(/ي/g,'ی').replace(/ك/g,'ک');
  const out = [];
  const push = (i,ok,detail) => out.push({i, ok, label:CHECKS[i], detail: detail ? toFa(detail) : detail});
  if(!text.trim()){ CHECKS.forEach((_,i)=>push(i,null)); return out; }
  const lines = text.split('\n').filter(l=>l.trim());
  const paras = lines.map(l=>l.trim());
  const counts = paras.map(p=>sentencesOf(p).length);
  const clauses = paras.map(p=>sentencesOf(p).reduce((n,x)=>n+Math.max(1, x.split(/\s(?:و|اما|ولی|چون|زیرا|پس)\s/).filter(t=>wordsOf(t).length>=3).length),0));
  push(0, paras.length>=3, paras.length>=3 ? `${paras.length} بند داری.` :
    paras.length===1 ? 'همه‌ی نوشته در یک بند است. مقدمه، بدنه و نتیجه را در سه بند جدا بنویس.' : `فقط ${paras.length} بند داری. یک بند دیگر اضافه کن.`);
  const noInd = lines.map((l,k)=>INDENT_RE.test(l)?0:k+1).filter(Boolean);
  push(1, noInd.length===0, noInd.length ? `اول بند ${noInd.join('، ')} تورفتگی ندارد. روی همان بند بزن و دکمه‌ی «تورفتگی» را بزن.` : '');
  const one = clauses.map((n,k)=>n<2?k+1:0).filter(Boolean);
  push(2, one.length===0, one.length ? `بند ${one.join('، ')} فقط یک جمله دارد. یک جمله‌ی توضیحی یا مثال اضافه کن (با نقطه جدا کن یا با «و» وصل کن).` : '');
  const long = counts.map((n,k)=>n>6?k+1:0).filter(Boolean);
  push(3, long.length===0, long.length ? `بند ${long.join('، ')} طولانی است. آن را به دو بند تقسیم کن.` : '');
  const noEnd = paras.map((q,k)=>/[.؟!?»…]$/.test(q)?0:k+1).filter(Boolean);
  push(4, noEnd.length===0, noEnd.length ? `پایان بند ${noEnd.join('، ')} علامت ندارد.` : '');
  const probs = [];
  if(/[^\S\n]+[،.؟!؛:]/.test(text)) probs.push('پیش از علامت نباید فاصله بگذاری.');
  if(/[،؛؟!](?![\s\u200c«»)\]"”’]|$)/.test(text) || /\.(?![\s.\d«»)\]"”’]|$)/.test(text) || /:(?![\s«]|$)/.test(text)) probs.push('بعد از علامت یک فاصله بگذار.');
  if(/[?,;]/.test(text)) probs.push('از علامت‌های فارسی «؟ ، ؛» استفاده کن.');
  push(5, probs.length===0, probs.join(' '));

  const toks = wordsOf(text);
  const freq = {};
  toks.forEach(t=>{ if(t.length>3 && !STOP.has(t)) freq[t]=(freq[t]||0)+1; });
  const lim = Math.max(4, Math.ceil(toks.length/40));
  const rp = Object.entries(freq).filter(([,n])=>n>=lim).map(([w,n])=>`«${w}» ${n} بار`);
  push(6, rp.length===0, rp.length ? `${rp.join('، ')} در نوشته‌ات زیاد تکرار شده است. به‌جای آن از کلمات جایگزین دیگر استفاده کن.` : '');

  const sens = sentencesOf(text);
  const msgs = [];
  const starts = {};
  sens.forEach(x=>{ const w = wordsOf(x)[0]; if(w) starts[w]=(starts[w]||0)+1; });
  Object.entries(starts).filter(([,n])=>n>=3).forEach(([w,n])=>msgs.push(`${n} جمله با «${w}» شروع شده‌اند.`));
  const seen = new Set(); let dup = false;
  sens.forEach(x=>{ const k = wordsOf(x).join(' '); if(seen.has(k)) dup = true; seen.add(k); });
  if(dup) msgs.push('یک جمله را دو بار نوشته‌ای.');
  const andy = sens.filter(x=>wordsOf(x).filter(w=>w==='و').length>=3).length;
  if(andy) msgs.push(`${andy} جمله چند «و» پشت‌سرهم دارد؛ آن را به دو جمله تقسیم کن.`);
  push(7, msgs.length===0, msgs.join(' '));

  const ar = detectArayeh(text);
  push(8, ar.length>0, ar.length ? 'پیدا شد: ' + ar.join('، ') + '.' : 'یک آرایه بیاور؛ تشبیه انتخاب خوبی برای شروع است (با «مثل» یا «مانند»). تضاد، کنایه، مبالغه و جان‌بخشی هم درست است. در متن بلند و چند بندی بهتر است حداقل یک آرایه داشته باشی. اگر آرایه‌ای آورده‌ای که برنامه نشناخت، به معلمت نشان بده.');
  push(9, toks.length>=60, `${toks.length} کلمه نوشته‌ای.`);
  return out;
}
const CHECKS_ONE = ['نوشته فقط یک بند است','اول بند تورفتگی دارد','بند حداقل چهار جمله دارد (اصلی، توضیح، پایانی)','بند خیلی طولانی نیست (حداکثر ۶ جمله)','بند با نقطه یا علامت پایانی تمام شده است','جمله‌ی آخر بند نتیجه می‌گیرد','علامت‌ها با فاصله‌ی درست نوشته شده‌اند','کلمه‌ها تکراری نیستند','جمله‌ها تکراری نیستند و شروع یکسان ندارند','نوشته حدود ۲۵ کلمه یا بیشتر است'];
const ISSUE_ONE = ['چند بند به‌جای یک بند','نداشتن تورفتگی','بند کمتر از چهار جمله','بند خیلی طولانی','نبود علامت پایانی','نبود جمله‌ی پایانی','فاصله‌گذاری علامت‌ها','تکرار کلمه','تکرار یا شروع یکسان جمله‌ها','نوشته‌ی کوتاه (کمتر از ۲۵ کلمه)'];
function evaluateOne(raw){
  const text = raw.replace(/ي/g,'ی').replace(/ك/g,'ک');
  const out = [];
  const push = (i,ok,detail) => out.push({i, ok, label:CHECKS_ONE[i], detail: detail ? toFa(detail) : detail});
  if(!text.trim()){ CHECKS_ONE.forEach((_,i)=>push(i,null)); return out; }
  const lines = text.split('\n').filter(l=>l.trim());
  const para = lines.join(' ').trim();
  push(0, lines.length===1, lines.length===1 ? '' : `${lines.length} بند نوشته‌ای. این‌جا فقط یک بند بنویس؛ برای چند بند به «گام ۲: انشای سه‌بندی» برو.`);
  const ind = INDENT_RE.test(lines[0]);
  push(1, ind, ind ? '' : 'اول بند تورفتگی ندارد. دکمه‌ی «تورفتگی» را بزن.');
  const sens = sentencesOf(para);
  const cl = sens.reduce((n,x)=>n+Math.max(1, x.split(/\s(?:و|اما|ولی|چون|زیرا|پس)\s/).filter(t=>wordsOf(t).length>=3).length),0);
  push(2, cl>=4, `${cl} جمله داری.` + (cl>=4 ? '' : ' یک جمله‌ی اصلی، یک یا دو جمله‌ی توضیحی و یک جمله‌ی پایانی بنویس.'));
  push(3, sens.length<=6, sens.length<=6 ? '' : 'بند طولانی است. بخشی از آن را در گام ۲ در بند جدا بنویس.');
  push(4, /[.؟!?»…]$/.test(para), /[.؟!?»…]$/.test(para) ? '' : 'پایان بند علامت ندارد.');
  const last = sens[sens.length-1] || '';
  const fin = /(?:به همین دلیل|برای همین|بنابراین|در نتیجه|به این ترتیب|خلاصه|(?:^|\s)پس(?:\s|$))/.test(last);
  push(5, fin, fin ? '' : 'جمله‌ی آخر را با «به همین دلیل ...» یا «برای همین ...» به نتیجه برسان.');
  const probs = [];
  if(/[^\S\n]+[،.؟!؛:]/.test(text)) probs.push('پیش از علامت نباید فاصله بگذاری.');
  if(/[،؛؟!](?![\s\u200c«»)\]"”’]|$)/.test(text) || /\.(?![\s.\d«»)\]"”’]|$)/.test(text) || /:(?![\s«]|$)/.test(text)) probs.push('بعد از علامت یک فاصله بگذار.');
  if(/[?,;]/.test(text)) probs.push('از علامت‌های فارسی «؟ ، ؛» استفاده کن.');
  push(6, probs.length===0, probs.join(' '));
  const toks = wordsOf(text);
  const freq = {};
  toks.forEach(t=>{ if(t.length>3 && !STOP.has(t)) freq[t]=(freq[t]||0)+1; });
  const rp = Object.entries(freq).filter(([,n])=>n>=3).map(([w,n])=>`«${w}» ${n} بار`);
  push(7, rp.length===0, rp.length ? `${rp.join('، ')} در نوشته‌ات زیاد تکرار شده است. به‌جای آن از کلمات جایگزین دیگر استفاده کن.` : '');
  const msgs = [], starts = {};
  sens.forEach(x=>{ const w = wordsOf(x)[0]; if(w) starts[w]=(starts[w]||0)+1; });
  Object.entries(starts).filter(([,n])=>n>=3).forEach(([w,n])=>msgs.push(`${n} جمله با «${w}» شروع شده‌اند.`));
  const seen = new Set(); let dup = false;
  sens.forEach(x=>{ const k = wordsOf(x).join(' '); if(seen.has(k)) dup = true; seen.add(k); });
  if(dup) msgs.push('یک جمله را دو بار نوشته‌ای.');
  push(8, msgs.length===0, msgs.join(' '));
  push(9, toks.length>=25, `${toks.length} کلمه نوشته‌ای.`);
  return out;
}
function evaluate(raw){ return mode==='one' ? evaluateOne(raw) : evaluateThree(raw); }
function runCheck(){
  const out = evaluate($('#txt').value);
  $('#res').innerHTML = out.map(o=>`<div class="check ${o.ok===null?'wait':o.ok?'ok':'bad'}"><i>${o.ok===null?'○':o.ok?'✓':'✗'}</i><div>${o.label}${o.detail?`<br><small>${o.detail}</small>`:''}</div></div>`).join('');
}
function indentLine(){
  const ta = $('#txt'); if(!ta) return;
  const v = ta.value, pos = ta.selectionStart;
  const ls = pos===0 ? 0 : v.lastIndexOf('\n', pos-1)+1;
  let le = v.indexOf('\n', ls); if(le<0) le = v.length;
  if(INDENT_RE.test(v.slice(ls, le))){ ta.focus(); return; }
  ta.value = v.slice(0,ls) + INDENT_STR + v.slice(ls);
  const np = pos + INDENT_STR.length;
  ta.focus(); ta.setSelectionRange(np,np);
  runCheck();
}
function logEssay(){
  const raw = $('#txt').value, msg = $('#logmsg');
  const toks = wordsOf(raw);
  const minW = mode==='one' ? 15 : 20;
  if(toks.length<minW){
    msg.innerHTML = `<div class="note bad"><b>✗</b> نوشته‌ات هنوز خیلی کوتاه است. حداقل ${fa(minW)} کلمه بنویس و بعد ثبت کن.</div>`; return;
  }
  const ev = evaluate(raw);
  const issues = ev.filter(o=>o.ok===false).map(o=>({name:(mode==='one'?ISSUE_ONE:ISSUE_NAMES)[o.i], detail:o.detail}));
  const paras = raw.split('\n').filter(l=>l.trim()).length;
  const key = mode + '|' + topic + '|' + raw.replace(/\s+/g,'').slice(0,25);
  const at = state.essays.findIndex(e=>e.key===key);
  const entry = {key, kind: mode==='one' ? 'یک بند' : 'انشای سه‌بندی', passed:ev.filter(o=>o.ok).length, total:ev.length, topic, text:raw.replace(/^(\s*\n)+/,'').replace(/\s+$/,''), words:toks.length, paras, issues, date:today(), rev:0};
  if(at>=0){ entry.rev = state.essays[at].rev+1; state.essays[at] = entry; } else state.essays.push(entry);
  msg.innerHTML = `<div class="note ok pop"><b>✓ ثبت شد.</b> ${fa(state.essays.length)} نوشته برای گزارش ثبت شده است. ${issues.length ? `${fa(issues.length)} ایراد مانده؛ اگر درستش کنی و دوباره ثبت کنی، نسخه‌ی بهتر جایگزین می‌شود.` : 'هیچ ایرادی نمانده، آفرین!'}</div>`;
}

/* ---------- گزارش برای معلم ---------- */
function buildReport(){
  const val = id => ($(id) ? $(id).value.trim() : '');
  const name = val('#rn'), teacher = val('#rt'), note = val('#rnote'), inc = $('#rinc') ? $('#rinc').checked : true;
  const L = [];
  const done = SECTIONS.filter(sec=>state.quizLog.some(q=>q.id===sec.id)).length;
  L.push('گزارش فعالیت – کارگاه انشا');
  L.push('گزارش شماره‌ی ' + fa(state.reportNo));
  L.push('نام دانش‌آموز: ' + (name || '—'));
  if(teacher) L.push('معلم: ' + teacher);
  L.push('تاریخ: ' + today());
  L.push('');
  const nOne = state.essays.filter(e=>e.kind==='یک بند').length;
  L.push(`خلاصه: ${fa(nOne)} بند و ${fa(state.essays.length-nOne)} انشای سه‌بندی نوشته شد و ${fa(done)} از ${fa(SECTIONS.length)} بخش تمرین انجام شد.`);
  L.push('');
  L.push('— نوشته‌ها —');
  if(!state.essays.length) L.push('در این نوبت نوشته‌ای ثبت نشده است.');
  state.essays.forEach((e,i)=>{
    L.push(`${fa(i+1)}) ${e.kind || 'انشا'} | موضوع: ${e.topic} | ${fa(e.words)} کلمه | ${fa(e.paras)} بند | نتیجه: ${fa(e.passed)} مورد درست از ${fa(e.total)}` + (e.rev ? ` | ${fa(e.rev)} بار بازنویسی` : ''));
    if(inc){ L.push('   متن انشا:'); e.text.split('\n').forEach(l=>L.push('   ' + l)); }
  });
  L.push('');
  L.push('— تمرین‌ها —');
  SECTIONS.forEach(sec=>{
    const logs = state.quizLog.filter(q=>q.id===sec.id);
    if(!logs.length){ L.push(`✗ ${sec.title}: انجام نشد`); return; }
    const best = logs.reduce((a,b)=>b.score/b.total>a.score/a.total?b:a);
    const last = logs[logs.length-1];
    L.push(`✓ ${sec.title}: انجام شد | ${fa(logs.length)} بار | آخرین نتیجه ${fa(last.score)} از ${fa(last.total)} | بهترین نتیجه ${fa(best.score)} از ${fa(best.total)}`);
  });
  if(note){ L.push(''); L.push('یادداشت دانش‌آموز: ' + note); }
  return L.join('\n');
}
function refreshReport(){

<script>
/* ===== لایه‌ی نسخه‌ی ۲: ذخیره‌ی خودکار، بانک سؤال، موضوع‌ها، بازنویسی، گزارش کامل‌تر ===== */
var PERSIST = ['best','sound','essays','quizLog','sent','reportNo','pending','seen','bestSet','goal','stamps','self','draft','rn','rt'];
var store = null;
try{ store = window.localStorage; store.setItem('__kn','1'); store.removeItem('__kn'); }catch(e){ store = null; }
function save(){
  if(!store) return;
  try{ var o = {}; PERSIST.forEach(function(k){ o[k] = state[k]; }); store.setItem('kn_workshop_v2', JSON.stringify(o)); }catch(e){}
}
function load(){
  if(!store) return;
  try{
    var o = JSON.parse(store.getItem('kn_workshop_v2') || 'null');
    if(o) PERSIST.forEach(function(k){ if(o[k] !== undefined) state[k] = o[k]; });
  }catch(e){}
}
load();
state.seen = state.seen || {}; state.bestSet = state.bestSet || {}; state.goal = state.goal || 1; state.stamps = state.stamps || [];
state.self = state.self || []; state.dis = {}; state.essays = state.essays || []; state.quizLog = state.quizLog || [];
setInterval(save, 2500);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', save);
var SELF = ['هر بند فقط درباره‌ی یک فکر است.',
  'اگر یک جمله را حذف کنم، معنی خراب نمی‌شود؟ (هر جمله لازم است.)',
  'جمله‌ی آخر، نتیجه‌ی همان موضوع است.',
  'کسی که موضوع را نمی‌داند هم نوشته‌ام را می‌فهمد.',
  'زمان فعل‌ها یکسان است و با کننده‌ی کار هماهنگ است.',
  'نوشته را یک بار بلند خوانده‌ام.',
  'در بازخوانی، املای کلمه‌ها را کنترل کرده‌ام.'];
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- بانک سؤال: هر بار ۸ سؤال تصادفی ---------- */
var QN = 8;
function mergePacks(){
  var P = window.PACK_Q;
  if(!P || mergePacks.done) return;
  mergePacks.done = 1;
  SECTIONS.forEach(function(s){ if(P[s.id]) s.qs = s.qs.concat(P[s.id]); });
  if(window.FORMAL_SECTION && !SECTIONS.some(function(s){ return s.id === 'formal'; })){

  }
  if(window.SPELL_SECTION && !SECTIONS.some(function(s){ return s.id === 'spell'; })){
    var fi = SECTIONS.map(function(s){ return s.id; }).indexOf('formal');
    if(fi < 0) fi = SECTIONS.map(function(s){ return s.id; }).indexOf('words');
    SECTIONS.splice(fi + 1, 0, window.SPELL_SECTION);
  }
  cleanQuestions();
  if(document.body.classList.contains('is-home')) home();
}
function pickQs(sec){
  var all = sec.qs.map(function(_,i){ return i; });
  var seen = state.seen[sec.id] || [];

    if(sw.length) out.push({ i:97, ok:'hint', label:'بازخوانی املا', detail:'هنگام بازخوانی، املای این کلمه‌ها را بررسی کن: ' + sw.slice(0,4).join('، ') + '. (این فقط یک پیشنهاد است؛ خودت تصمیم بگیر.)' });
  }
  if(!raw.trim()){ out.push({ i:98, ok:null, label:CL_LABEL }); }
  else{
    var cf = findColl(raw);
    var o98 = { i:98, ok:cf.length === 0, label:CL_LABEL, detail: cf.length ? toFa(cf.slice(0,4).map(function(x){ return '«' + x.from + '» ← «' + x.to + '»'; }).join('، ') + (cf.length > 4 ? ' و ...' : '')) : '' };
    if(!o98.ok){
      var sp0 = sp.filter(function(x){ return x.txt.indexOf(cf[0].from) >= 0; })[0];
      if(sp0) o98.fix = { s:sp0.s, e:sp0.e, txt:sp0.txt, hint:'در این جمله «' + cf[0].from + '» گفتاری است؛ شکل نوشتاری‌اش «' + cf[0].to + '» است. جمله را دوباره بنویس.' };
      if(state.dis[mode + ':98']){ o98.dis = true; o98.ok = true; o98.detail = 'این مورد را درست نمی‌دانی؛ معلم می‌بیند و قضاوت می‌کند.'; }
    }
    out.push(o98);
  }
  var sErr = raw.trim() ? findSpell(raw) : [];
  var s0 = sErr.length ? sp.filter(function(x){ return x.txt.indexOf(sErr[0].from) >= 0; })[0] : null;
  addItem(out, 97, SPELL_LABEL, raw, sErr.length > 0, sErr.slice(0,4).map(function(x){ return '«' + x.from + '» ← «' + x.to + '»'; }).join('، ') + (sErr.length > 4 ? ' و ...' : '') + ' (فقط غلط‌های رایج را می‌شناسم؛ خودت هم بازخوانی کن.)', s0, sErr.length ? 'کلمه‌ی «' + sErr[0].from + '» غلط نوشته شده؛ درست آن «' + sErr[0].to + '» است. جمله را دوباره بنویس.' : '');
  var vIs = raw.trim() ? findVerbIssues(raw) : [];
  addItem(out, 96, VERB_LABEL, raw, vIs.length > 0, vIs.slice(0,2).map(function(x){ return x.msg; }).join(' '), vIs.length ? vIs[0].sp : null, 'فعل این جمله با زمان یا کننده‌ی کار هماهنگ نیست. فعل را درست کن.');
  var vg = raw.trim() ? findVague(raw) : { bad:false, c:{} };
  var vs = vg.bad ? sp.filter(function(x){ return wordsOf(x.txt).some(function(t){ return t.replace(/\u200c/g,'') === vg.first; }); })[0] : null;
  addItem(out, 95, VOC_LABEL, raw, vg.bad, Object.keys(vg.c).map(function(k){ return '«' + k + '» ' + vg.c[k] + ' بار'; }).join('، ') + ' آمده است؛ به‌جایشان واژه‌ی دقیق‌تر بنویس (بانک واژه را ببین).', vs, 'به‌جای «' + vg.first + '» بنویس چه چیزی چطور بود (مثلاً «رنگارنگ»، «دل‌انگیز»، «خوشمزه»). از بانک واژه کمک بگیر.');
  if(raw.trim()){
    var keys = topicKeys();
    if(keys.length){
      var weak = [];
      raw.split('\n').filter(function(l){ return l.trim(); }).forEach(function(l,k){
        var w = wordsOf(l);
        if(!w.some(function(t){ return keys.some(function(key){ return t.indexOf(key) >= 0; }); })) weak.push(k+1);
      });
      if(weak.length) out.push({ i:99, ok:'hint', label:'ربط نوشته با موضوع', detail:toFa('در بند ' + weak.join('، ') + ' کلمه‌ای از موضوع «' + topic + '» دیده نشد. مطمئن شو این بند به موضوع ربط دارد. (این فقط یک نشانه است؛ خودت قضاوت کن.)') });
    }
  }
  return out;
}
function runCheck(){
  var ta = $('#txt'); if(!ta) return;
  var raw = ta.value;
  if(!raw.trim()) state.dis = {};
  state.draft = { mode:mode, topic:topic, text:raw };
  var out = evalFull(raw); lastEval = out;
  $('#res').innerHTML = (raw.trim() ? '<p class="chk-note">معلم کوچک فقط غلط‌های رایج را می‌شناسد؛ بعد از بازخوانی خودت هم یک بار نوشته‌ات را دوباره نگاه کن.</p>' : '') + out.map(function(o,k){
    var c = o.ok===null ? 'wait' : (o.ok==='hint' ? 'warn' : (o.ok ? 'ok' : 'bad'));
    var ic = o.ok===null ? '○' : (o.ok==='hint' ? '؟' : (o.ok ? '✓' : '✗'));
    var b = '';
    if(o.ok === false){
      if(o.fix) b += '<button class="btn ghost sm" data-fix="' + k + '">این جمله را دوباره بنویس</button> ';
      b += '<button class="btn ghost sm" data-dis="' + k + '">این ایراد درست نیست</button>';
    }
    if(o.dis) b += '<button class="btn ghost sm" data-dis="' + k + '">برگرداندن</button>';
    return '<div class="check ' + c + '"><i>' + ic + '</i><div>' + o.label + (o.detail ? '<br><small>' + o.detail + '</small>' : '') + (b ? '<div class="cb">' + b + '</div>' : '') + '</div></div>';
  }).join('');
  var gb = $('#goalbar'); if(gb) gb.innerHTML = goalHTML();
}
function toggleDis(k){
  var o = lastEval[k]; if(!o) return;
  var key = mode + ':' + o.i; state.dis[key] = !state.dis[key]; runCheck();
}
function openFix(k){
  var o = lastEval[k]; if(!o || !o.fix) return;
  var f = o.fix; rw = { s:f.s, e:f.e, orig:f.txt };
  $('#rwbox').innerHTML = '<div class="paper rwp"><b>بازنویسی این جمله</b><div class="exb">' + esc(f.txt) + '</div><p><small>' + f.hint + '</small></p><textarea id="rwt" class="rwt" aria-label="جمله‌ی تازه">' + esc(f.txt) + '</textarea><div class="row"><button class="btn" data-rwdo>جایگزین کن</button><button class="btn ghost" data-rwcancel>لغو</button></div></div>';
  var t = $('#rwt'); if(t){ t.focus(); try{ t.scrollIntoView({block:'center'}); }catch(e){} }
}
function applyFix(){
  var ta = $('#txt'), t = $('#rwt'); if(!ta || !t || !rw) return;
  var v = ta.value, nt = t.value.trim(); if(!nt) return;
  var s = rw.s, e = rw.e;
  if(v.slice(s,e) !== rw.orig){
    var ix = v.indexOf(rw.orig);
    if(ix < 0){ $('#rwbox').innerHTML = '<div class="note bad">متن تغییر کرده است؛ دوباره دکمه‌ی «بازنویسی کن» را بزن.</div>'; return; }
    s = ix; e = ix + rw.orig.length;
  }
  ta.value = v.slice(0,s) + nt + v.slice(e);
  $('#rwbox').innerHTML = '<div class="note ok pop"><b>✓</b> جمله عوض شد.</div>'; rw = null;
  runCheck();
}

function logEssay(){
  const raw = $('#txt').value, msg = $('#logmsg');
  const toks = wordsOf(raw);
  const minW = mode==='one' ? 15 : 20;
  if(toks.length<minW){
    msg.innerHTML = `<div class="note bad"><b>✗</b> نوشته‌ات هنوز خیلی کوتاه است. حداقل ${fa(minW)} کلمه بنویس و بعد ثبت کن.</div>`; return;
  }
  const ev = evalFull(raw).filter(function(o){ return o.ok !== 'hint'; });
  const issues = ev.filter(o=>o.ok===false).map(o=>({name:issueName(o), detail:o.detail}));
  const disp = ev.filter(o=>o.dis).map(o=>issueName(o));
  const paras = raw.split('\n').filter(l=>l.trim()).length;
  const key = mode + '|' + topic + '|' + raw.replace(/\s+/g,'').slice(0,25);
  const at = state.essays.findIndex(e=>e.key===key);
  const selfN = SELF.reduce(function(n,_,i){ return n + (state.self[i] ? 1 : 0); }, 0);
  const entry = {key, kind: mode==='one' ? 'یک بند' : 'انشای سه‌بندی', passed:ev.filter(o=>o.ok).length, total:ev.length, topic, text:raw.replace(/^(\s*\n)+/,'').replace(/\s+$/,''), words:toks.length, paras, issues, disp, selfN, date:today(), rev:0};
  if(at>=0){ entry.rev = state.essays[at].rev+1; state.essays[at] = entry; } else { state.essays.push(entry); state.stamps.push(Date.now()); state.stamps = state.stamps.slice(-200); }
  save();
  msg.innerHTML = `<div class="note ok pop"><b>✓ ثبت شد.</b> ${fa(state.essays.length)} نوشته برای گزارش ثبت شده است. ${issues.length ? `${fa(issues.length)} ایراد مانده؛ اگر درستش کنی و دوباره ثبت کنی، نسخه‌ی بهتر جایگزین می‌شود.` : 'هیچ ایرادی نمانده، آفرین!'}</div>`;
  const gb = $('#goalbar'); if(gb) gb.innerHTML = goalHTML();
}

  function starts(tk, ph){ for(var j=0;j<ph.length;j++){ if(!tk[j] || tk[j].n !== ph[j]) return false; } return true; }
  var _findCommaB = function(raw){
    var out = [], offs = 0, VF = buildVerbs();
    function isVerb(n){ return !!(VF[n] || /^(بود|بودم|بودی|بودیم|بودید|بودند|است|هستم|هستی|هستیم|هستید|هستند|شد|شدم|شدیم|شدند|داشت|داشتم|داشتیم|داشتند)$/.test(n)); }
    function modal(n){ return /^(ن?ب)/.test(n) || /(خواه|دار|توان)/.test(n) || n === 'باید' || n === 'شاید'; }
    raw.split('\n').forEach(function(line){
      var base = offs; offs += line.length + 1;
      var lead = line.length - line.replace(/^[\s\u2003\u2800]+/,'').length;
      var body = line.slice(lead).replace(/\s+$/,'');
      var re = /[^.؟!?…]+[.؟!?…»"”]*/g, m;
      while((m = re.exec(body))){
        var pl = m[0].length - m[0].replace(/^\s+/,'').length;
        var txt = m[0].slice(pl).replace(/\s+$/,'');
        var content = txt.replace(/[.؟!?…»"”'’)\]\s]+$/,'');
        var masked = content.replace(/«[^»]*»/g, function(x){ return new Array(x.length + 1).join(' '); });
        var tk = toks(masked);
        if(tk.length < 3) continue;
        var sp = { s:base + lead + m.index + pl, e:base + lead + m.index + pl + txt.length, txt:txt };
        var hasComma = /[،,]/.test(masked), found = false, j, k;
        function add(msg, t1, t2){ out.push({ sp:(t1 ? { s:sp.s + t1.i, e:sp.s + t2.e, txt:txt.slice(t1.i, t2.e) } : sp), key:sp.s, msg:msg }); found = true; }
        /* ۱) واژه‌های آغازین مثل «بنابراین»، «متأسفانه» */
        for(j = 0; j < OPEN.length && !found; j++){
          var ph = OPEN[j];
          if(starts(tk, ph) && tk.length > ph.length){
            var lt = tk[ph.length - 1];
            if(!/^\s*[،,]/.test(masked.slice(lt.e))) add('بعد از «' + ph.map(function(x,q){ return tk[q].t; }).join(' ') + '» ویرگول بگذار.');
          }
        }
        /* ۲) جمله‌ی پیرو در آغاز جمله */
        for(j = 0; j < SUB.length && !found; j++){
          if(starts(tk, SUB[j]) && tk.length >= 7 && !hasComma)
            add('جمله با «' + tk.slice(0, SUB[j].length).map(function(x){ return x.t; }).join(' ') + '» شروع شده است؛ بعد از بخش پیرو (پیش از جمله‌ی اصلی) ویرگول بگذار.');
        }
        /* ۳) پیش از «اما»، «ولی»، «بلکه»، «زیرا» */
        for(k = 2; k < tk.length && !found; k++){
          if(CONJ.indexOf(tk[k].n) >= 0 && /^\s+$/.test(masked.slice(tk[k-1].e, tk[k].i)))
            add('پیش از «' + tk[k].t + '» ویرگول بگذار: «' + tk[k-1].t + '، ' + tk[k].t + ' ...».', tk[k-1], tk[k]);
        }
        /* ۴) چند مورد شمرده‌شده که با «همگی» جمع‌بندی می‌شوند: دود کارخانه، آشغال ریختن در رودخانه، ... همگی */
        for(k = 4; k < tk.length - 1 && !found; k++){
          var sumUp = tk[k].n === 'همگی' || (tk[k].n === 'همه' && /^(اینها|آنها)$/.test(tk[k+1].n));
          if(!sumUp) continue;
          var before = masked.slice(0, tk[k].i), commaBefore = /[،,]\s*$/.test(before);
          var lastAnd = -1;
          for(var ia = k - 1; ia >= 0; ia--){ if(tk[ia].n === 'و'){ lastAnd = ia; break; } }
          var q5 = tk.slice(lastAnd >= 2 ? lastAnd - 2 : Math.max(0, k - 4), k).map(function(x){ return x.t; }).join(' ');
          var firstT = tk[Math.max(0, k - 7)];
          if(!commaBefore) add('چند مورد را پشت سر هم شمرده‌ای و با «' + tk[k].t + '» جمع‌بندی کرده‌ای؛ پیش از «' + tk[k].t + '» ویرگول بگذار و بین موردها هم ویرگول بگذار (هر مورد می‌تواند چند کلمه باشد). مثلاً: «' + q5 + '، ' + tk[k].t + ' ...».', firstT, tk[k]);
          else if(k >= 6 && !/[،,]/.test(before.replace(/[،,]\s*$/, ''))) add('بین موردهایی که پیش از «' + tk[k].t + '» شمرده‌ای ویرگول بگذار (هر مورد می‌تواند چند کلمه باشد)؛ مثلاً: «' + q5 + '، ' + tk[k].t + ' ...».', firstT, tk[k]);
        }
        /* ۴-ب) بعد از «مانند»، «مثل»، «از جمله» و ... چند مورد پشت سر هم */
        for(k = 0; k < tk.length - 5 && !found; k++){
          var il = 0;
          if(['مانند','مثل','نظیر','همچون','عبارتاند','عبارتند'].indexOf(tk[k].n) >= 0) il = 1;
          else if(tk[k].n === 'از' && tk[k+1] && tk[k+1].n === 'جمله') il = 2;
          if(!il) continue;
          var st = k + il, jj = -1;
          for(var z = st + 3; z < tk.length - 1; z++){ if(tk[z].n === 'و'){ jj = z; break; } }
          if(jj < 0 || /[،,]/.test(masked.slice(tk[st].i, tk[jj].i))) continue;
          var en = Math.min(tk.length - 1, jj + 2);
          add('بعد از «' + tk.slice(k, k + il).map(function(x){ return x.t; }).join(' ') + '» چند مورد را شمرده‌ای: «' + tk.slice(st, en + 1).map(function(x){ return x.t; }).join(' ') + '». بین موردها ویرگول بگذار و فقط پیش از آخرین مورد «و» بنویس (هر مورد می‌تواند چند کلمه باشد).', tk[st], tk[en]);
        }
        /* ۵) فهرست چند چیز پشت سر هم */
        for(k = 0; k + 3 < tk.length && !found; k++){
          var A = tk[k], B = tk[k+1], C = tk[k+2], D = tk[k+3];
          if(B.n !== 'و' && C.n === 'و' && cat(A.n) && cat(A.n) === cat(B.n) && cat(B.n) === cat(D.n) && /^ +$/.test(masked.slice(A.e, B.i)) && /^ +$/.test(masked.slice(B.e, C.i)))
            add('«' + A.t + ' ' + B.t + ' و ' + D.t + '» چند کلمه‌ی هم‌دسته‌اند؛ بینشان ویرگول بگذار: «' + A.t + '، ' + B.t + ' و ' + D.t + '».', A, D);
          else if(B.n === 'و' && D.n === 'و' && cat(A.n) && cat(A.n) === cat(C.n) && tk[k+4] && cat(tk[k+4].n) === cat(A.n))
            add('«' + A.t + ' و ' + C.t + ' و ' + tk[k+4].t + '» چند کلمه‌ی هم‌دسته‌اند؛ به‌جای اولین «و» ویرگول بگذار: «' + A.t + '، ' + C.t + ' و ' + tk[k+4].t + '».', A, tk[k+4]);
        }
        /* ۵) دو جمله‌ی پشت سر هم بدون هیچ علامتی */
        if(!hasComma && tk.length >= 6){
          for(var a = 0; a < tk.length - 3 && !found; a++){
            if(!isVerb(tk[a].n) || modal(tk[a].n)) continue;
            for(var b = a + 3; b < tk.length && !found; b++){
              if(STOP.indexOf(tk[b-1].n) >= 0) break;
              var stopHit = false;
              for(var q = a + 1; q < b; q++) if(STOP.indexOf(tk[q].n) >= 0) stopHit = true;
              if(stopHit) break;
              if(isVerb(tk[b].n) && !modal(tk[b].n) && !(tk[b].n === 'است' || tk[b].n === 'بود')){
                add('بعد از «' + tk[a].t + '» ویرگول (یا نقطه) بگذار؛ دو جمله‌ی پشت سر هم نوشته‌ای: «' + tk.slice(a, b + 1).map(function(x){ return x.t; }).join(' ') + '».', tk[a], tk[b]);
              }
            }
          }
        }
      }
    });
    return out;
  };
  var _findCommaA = window.findComma;
  var GENERIC = 'این جمله بلند است و ویرگول ندارد';
  function fallback(sp){
    var masked = sp.txt.replace(/«[^»]*»/g, function(x){ return new Array(x.length + 1).join(' '); });
    var tk = toks(masked), best = -1, mid = tk.length / 2;
    for(var k = 2; k < tk.length - 1; k++){
      if(['و','که','چون','تا','اما','ولی'].indexOf(tk[k].n) >= 0 && (best < 0 || Math.abs(k - mid) < Math.abs(best - mid))) best = k;
    }
    if(best < 0) return null;
    var from = Math.max(0, best - 3);
    return { sp:{ s:sp.s + tk[from].i, e:sp.s + tk[best + 1].e, txt:sp.txt.slice(tk[from].i, tk[best + 1].e) },
      msg:'این جمله بلند است و ویرگول ندارد. مثلاً می‌توانی بعد از «' + tk[best-1].t + '» ویرگول بگذاری: «' + tk.slice(from, best).map(function(x){ return x.t; }).join(' ') + '، ' + tk[best].t + ' ' + tk[best+1].t + ' ...».' };
  }
  window.findComma = function(raw){
    var a = _findCommaA(raw), b = _findCommaB(raw), hasB = {}, seen = {}, res = [];
    b.forEach(function(x){ hasB[x.key] = 1; });
    function concrete(x){
      var masked = x.sp.txt.replace(/«[^»]*»/g, function(y){ return new Array(y.length + 1).join(' '); });
      var tk = toks(masked), m1 = /^پیش از «(.+?)» ویرگول بگذار\./.exec(x.msg), m2 = /^بعد از «(.+?)» ویرگول بگذار(.*)$/.exec(x.msg), k, ex;
      if(m1){
        for(k = 1; k < tk.length; k++) if(tk[k].t === m1[1]) break;
        if(k < tk.length){
          ex = tk[k-1].t + '، ' + tk[k].t + (tk[k+1] ? ' ' + tk[k+1].t : '') + ' ...';
          return { sp:{ s:x.sp.s + tk[k-1].i, e:x.sp.s + tk[k].e, txt:x.sp.txt.slice(tk[k-1].i, tk[k].e) }, key:x.sp.s, msg:'پیش از «' + m1[1] + '» ویرگول بگذار: «' + ex + '».' };
        }
      } else if(m2){
        var lastW = m2[1].split(' ').pop();
        for(k = 0; k < tk.length - 1; k++) if(tk[k].t === lastW) break;
        if(k < tk.length - 1){
          var f = Math.max(0, k - 2);
          ex = tk.slice(f, k + 1).map(function(y){ return y.t; }).join(' ') + '، ' + tk[k+1].t + ' ...';
          return { sp:{ s:x.sp.s + tk[f].i, e:x.sp.s + tk[k+1].e, txt:x.sp.txt.slice(tk[f].i, tk[k+1].e) }, key:x.sp.s, msg:'بعد از «' + m2[1] + '» ویرگول بگذار: «' + ex + '»' + ((m2[2] && m2[2] !== '.') ? m2[2].replace(/^\s*/, ' ') : '.') };
        }
      }
      return null;
    }
    a.forEach(function(x){
      var cx = concrete(x);
      if(cx){ res.push(cx); seen[x.sp.s] = 1; return; }
      if(x.msg.indexOf(GENERIC) === 0){
        if(hasB[x.sp.s]) return;
        var f = fallback(x.sp);
        if(f){ res.push({ sp:f.sp, key:x.sp.s, msg:f.msg }); seen[x.sp.s] = 1; return; }
      }
      res.push({ sp:x.sp, key:x.sp.s, msg:x.msg }); seen[x.sp.s] = 1;
    });
    b.forEach(function(x){ if(!seen[x.key]){ seen[x.key] = 1; res.push(x); } });
    res.sort(function(p, q){ return p.sp.s - q.sp.s; });
    return res;
  };
})();
</script>

/* بعد از پاسخ، توضیح و دکمه‌ی «سؤال بعدی» همان‌جا در صفحه دیده شود */

      if(fb && fb.scrollIntoView) fb.scrollIntoView({ block:'nearest', behavior:'smooth' });
